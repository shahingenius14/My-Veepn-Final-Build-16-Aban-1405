name: Build My VeePN Ultimate APK

on:
workflow_dispatch:
push:
branches:
- main
- master

jobs:
build-apk:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4

- name: Extract ZIP File
run: unzip -o "*.zip" || true

- name: Set up JDK 17
uses: actions/setup-java@v5
with:
java-version: '17'
distribution: 'temurin'

- name: Compile and Build APK
run: |
NDK_PATH=$(ls -d$ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
if [ -z "$NDK_PATH" ]; then
echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"
fi
mkdir -p android/app/src/main/jniLibs/arm64-v8a
git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git || true
if [ -d "hev-socks5-tunnel" ]; then
$NDK_PATH/ndk-
