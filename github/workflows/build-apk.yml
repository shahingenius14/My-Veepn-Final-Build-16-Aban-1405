name: Build My VeePN Ultimate APK (arm64-v8a / v2.0.1)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK (r27c for 16KB Page Size)
        uses: android-actions/setup-android@v3

      - name: Install NDK r27c & Build hev-socks5-tunnel (arm64-v8a)
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          $ANDROID_HOME/ndk/27.2.12479018/ndk-build -C hev-socks5-tunnel \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-29 \
            APP_LDFLAGS="-Wl,-z,max-page-size=16384" \
            NDK_LIBS_OUT=$(pwd)/android/app/src/main/jniLibs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Signed Debug APK (arm64-v8a)
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: My-VeePN-Ultimate-arm64-v8a-APK
          path: android/app/build/outputs/apk/debug/*.apk
